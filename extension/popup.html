<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 240px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  p { margin: 8px 0 0; opacity: .65; font-size: 12px; }
</style>
</head>
<body>
  <h1>Varnelė</h1>
  <label><input type="checkbox" id="enabled"> Check Lithuanian text</label>
  <label><input type="checkbox" id="site"> On <span id="host">this site</span></label>
  <label><input type="checkbox" id="formal"> Mark spoken forms</label>
  <p>Text is checked on this computer. Nothing is sent anywhere.</p>
  <script src="popup.js"></script>
</body>
</html>
